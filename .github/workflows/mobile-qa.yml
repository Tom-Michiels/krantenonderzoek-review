name: Mobile review QA
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mobile-review-qa
  cancel-in-progress: true
jobs:
  mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install browser test runtime
        run: npm install --no-save --package-lock=false playwright@1.62.1
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Check mobile review
        env:
          SITE_ROOT: .
          QA_OUTPUT: qa-results
        run: node tests/mobile.cjs
      - name: Save screenshots and report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mobile-review-qa
          path: qa-results/
          retention-days: 7
          if-no-files-found: warn
